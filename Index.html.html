<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OMAÉ | BY.OMAE</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a1710;
      --gold: #C9A96E;
      --gold-light: #E8D5A3;
      --text: #0a0905;
      --text-muted: #3d3828;
      --card-bg: #f0e8d6;
      --card-border: rgba(201,169,110,0.45);
      --card-hover: #e8dcc8;
    }

    body {
      background-color: var(--bg);
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(201,169,110,0.09) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 80% 100%, rgba(201,169,110,0.05) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Brand */
    .brand {
      text-align: center;
      margin-bottom: 36px;
    }

    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 56px;
      font-weight: 400;
      letter-spacing: 0.22em;
      color: var(--gold-light);
      line-height: 1;
      text-transform: uppercase;
    }

    .brand-tagline {
      margin-top: 10px;
      font-size: 9px;
      letter-spacing: 0.4em;
      color: rgba(232,213,163,0.45);
      text-transform: uppercase;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 20px auto 32px;
    }

    /* Link cards */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border: 1px solid var(--card-border);
      text-decoration: none;
      color: var(--text);
      background: var(--card-bg);
      transition: background 0.25s ease, border-color 0.25s ease, transform 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .link-card:hover {
      background: var(--card-hover);
      border-color: var(--gold);
      transform: translateY(-1px);
    }

    .link-inner {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .link-icon {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .link-icon svg {
      width: 18px;
      height: 18px;
      fill: var(--text-muted);
      transition: fill 0.25s;
    }

    .link-card:hover .link-icon svg {
      fill: var(--text);
    }

    .link-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .link-label {
      font-size: 9px;
      letter-spacing: 0.28em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .link-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 17px;
      font-weight: 400;
      letter-spacing: 0.12em;
      color: var(--text);
      text-transform: uppercase;
    }

    .link-arrow {
      color: var(--gold);
      font-size: 14px;
      opacity: 0.6;
      transition: opacity 0.25s, transform 0.25s;
      flex-shrink: 0;
    }

    .link-card:hover .link-arrow {
      opacity: 1;
      transform: translateX(3px);
    }

    /* Footer */
    .footer {
      margin-top: 40px;
      text-align: center;
    }

    .footer-line {
      display: block;
      width: 1px;
      height: 28px;
      background: linear-gradient(to bottom, var(--gold), transparent);
      margin: 0 auto 14px;
      opacity: 0.3;
    }

    .footer-text {
      font-size: 9px;
      letter-spacing: 0.28em;
      color: rgba(232,213,163,0.25);
      text-transform: uppercase;
    }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .brand                   { animation: fadeUp 0.7s ease both; }
    .divider                 { animation: fadeUp 0.7s 0.15s ease both; }
    .link-card:nth-child(1)  { animation: fadeUp 0.6s 0.25s ease both; }
    .link-card:nth-child(2)  { animation: fadeUp 0.6s 0.35s ease both; }
    .link-card:nth-child(3)  { animation: fadeUp 0.6s 0.45s ease both; }
    .link-card:nth-child(4)  { animation: fadeUp 0.6s 0.55s ease both; }
    .footer                  { animation: fadeUp 0.6s 0.7s ease both; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>
